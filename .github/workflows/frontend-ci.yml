name: Frontend CI/CD Pipeline

on:
  push:
    branches:
      - main
      - development
      - ammar
      - rafif
  pull_request:
    branches:
      - main
      - development
      - ammar
      - rafif

jobs:
  test:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

      - name: Build frontend
        env:
          VITE_API_URL: https://api.e-dasawisma.web.id
        run: npm run build

  deploy:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to Azure VM
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_SSH_PORT || 22 }}
          script: |
            set -e
            if [ -s "$HOME/.nvm/nvm.sh" ]; then
              . "$HOME/.nvm/nvm.sh"
              nvm use --lts
            fi
            cd /var/www/project-ta/Frontend-TA
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            printf "VITE_API_URL=https://api.e-dasawisma.web.id\n" > .env.production
            npm ci
            npm run build
            sudo nginx -t
            sudo systemctl reload nginx
